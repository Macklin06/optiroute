services:

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: optiroute
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

  router:
    build: ./router
    ports:
      - "8080:8080"
    depends_on:
      - redis
      - postgres

  predictor:
    build: ./predictor
    ports:
      - "8000:8000"
    depends_on:
      - redis

  dashboard:
    build: ./dashboard
    ports:
      - "5173:5173"
    depends_on:
      - router
      - predictor